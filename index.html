<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <title>Gedankencockpit</title>
  
  <link rel="apple-touch-icon" href="icon-180.png">
  
  <style>
    :root { 
      --bg: #0f172a; 
      --card-bg: #1e293b; 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
      --accent: #3b82f6; 
      --danger: #ef4444; 
    }
    
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: var(--bg); 
      color: var(--text); 
      padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 100px); 
      margin: 0; 
      overflow-wrap: anywhere; 
    }
    
    input, select, textarea, button { 
      font-family: inherit; 
      font-size: 16px; 
      box-sizing: border-box; 
    } 
    
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 24px; }
    .header-actions { display: flex; gap: 10px; }
    .btn-icon { background: var(--card-bg); color: var(--text); border: none; padding: 10px; border-radius: 12px; min-height: 44px; min-width: 44px; font-size: 18px; cursor: pointer; }
    
    .search-bar { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--card-bg); color: var(--text); margin-bottom: 16px; }
    
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; margin-bottom: 8px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: var(--card-bg); color: var(--text-muted); border: none; padding: 10px 16px; border-radius: 20px; white-space: nowrap; min-height: 44px; font-weight: 600; cursor: pointer; }
    .tab.active { background: var(--accent); color: white; }

    .sub-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; margin-bottom: 16px; }
    .sub-tabs::-webkit-scrollbar { display: none; }
    .sub-tabs:empty { display: none; margin-bottom: 0; }
    .sub-tab { background: transparent; color: var(--text-muted); border: 1px solid #334155; padding: 6px 14px; border-radius: 16px; font-size: 13px; white-space: nowrap; font-weight: 600; cursor: pointer; }
    .sub-tab.active { background: #334155; color: var(--text); border-color: #475569; }

    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: opacity 0.3s; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
    .badge { background: #334155; padding: 4px 8px; border-radius: 8px; font-weight: bold; color: var(--text); }
    .card-text { font-size: 16px; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; transition: color 0.3s; }
    .card-text a { color: var(--accent); text-decoration: underline; }
    
    /* Erledigt-Status Optik */
    .card.is-done { opacity: 0.55; }
    .card.is-done .card-text { text-decoration: line-through; color: var(--text-muted); }

    .card-actions { display: flex; justify-content: space-between; gap: 8px; margin-top: 12px; border-top: 1px solid #334155; padding-top: 12px; }
    .card-actions button { 
      flex: 1; 
      border: none; 
      padding: 10px 2px; 
      border-radius: 10px; 
      min-height: 44px; 
      font-size: 11px; 
      letter-spacing: -0.3px; 
      white-space: nowrap !important; 
      font-weight: bold; 
      cursor: pointer; 
      text-align: center; 
    }
    
    /* Der neue kleine Erledigt-Button */
    .btn-done { 
      background: #059669; 
      color: white; 
      flex: 0 0 44px !important; 
      font-size: 18px !important; 
      padding: 0 !important; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
    }
    .btn-done.done-active { background: #334155; color: var(--text-muted); }

    .btn-edit { background: #334155; color: var(--text); }
    .btn-move { background: #334155; color: var(--text); }
    .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; justify-content: center; }
    .modal-box { background: var(--card-bg); width: 100%; border-radius: 24px 24px 0 0; padding: 24px 24px calc(env(safe-area-inset-bottom) + 24px); transform: translateY(100%); transition: transform 0.3s ease-out; box-sizing: border-box; }
    .modal-overlay.open { display: flex; }
    .modal-overlay.open .modal-box { transform: translateY(0); }
    
    .modal-box h3 { margin-top: 0; margin-bottom: 16px; }
    .modal-box label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; font-weight: 600; }
    .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: var(--text); margin-bottom: 16px; }
    .modal-box textarea { resize: vertical; min-height: 100px; line-height: 1.4; }
    
    .modal-actions { display: flex; gap: 12px; }
    .modal-actions button { flex: 1; border: none; padding: 14px; border-radius: 12px; min-height: 44px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #334155; color: var(--text); }
    .btn-confirm { background: var(--accent); color: white; }

    .banner { display: none; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 16px; font-weight: bold; }
    .banner.offline { background: #b45309; color: white; }
    .banner.error { background: var(--danger); color: white; }
    
    #undo-banner {
      display: none;
      position: fixed;
      bottom: calc(env(safe-area-inset-bottom) + 24px);
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 12px 20px;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      z-index: 9999;
      font-size: 14px;
      align-items: center;
      gap: 16px;
      border: 1px solid #334155;
    }
    #btn-undo {
      background: var(--accent);
      border: none;
      color: #fff;
      font-weight: bold;
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      min-height: 36px;
    }

    .loading-text { text-align: center; color: var(--text-muted); margin-top: 40px; }
    body.modal-open { overflow: hidden; }
  </style>
</head>
<body>
  <div id="offline-banner" class="banner offline">Offline-Modus</div>
  <div id="error-banner" class="banner error"></div>

  <div class="header">
    <h1>Cockpit 2</h1>
    <div class="header-actions">
      <button class="btn-icon" id="btn-settings" title="Einstellungen">⚙️</button>
      <button class="btn-icon" id="btn-refresh" title="Laden">↻</button>
    </div>
  </div>

  <input type="text" id="search-input" class="search-bar" placeholder="Suchen...">

  <div class="tabs" id="tabs-container"></div>
  <div class="sub-tabs" id="sub-tabs-container"></div>

  <div id="cards-container">
    <div class="loading-text">Lade Gedanken...</div>
  </div>

  <div class="modal-overlay" id="setup-modal">
    <div class="modal-box">
      <h3>System einrichten</h3>
      <input type="url" id="input-api-url" placeholder="Neue Web-App URL einfügen">
      <input type="password" id="input-api-token" placeholder="Geheimer APP_TOKEN">
      <div class="modal-actions">
        <button class="btn-confirm" id="btn-save-setup">Speichern</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="move-modal">
    <div class="modal-box">
      <h3>Verschieben</h3>
      <label for="move-target-cat">Zielkategorie:</label>
      <select id="move-target-cat">
        <option value="Eingang">Eingang</option>
        <option value="Arbeit">Arbeit</option>
        <option value="Privat">Privat</option>
        <option value="KI">KI</option>
        <option value="Lesen">Lesen</option>
      </select>
      <label for="move-target-subcat">Unterkategorie:</label>
      <input type="text" id="move-target-subcat" placeholder="Neue Unterkategorie">
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-move">Abbrechen</button>
        <button class="btn-confirm" id="btn-confirm-move">Speichern</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="edit-modal">
    <div class="modal-box">
      <h3>Eintrag bearbeiten</h3>
      <label for="edit-text">Text:</label>
      <textarea id="edit-text" placeholder="Text anpassen..."></textarea>
      <label for="edit-subcat">Unterkategorie:</label>
      <input type="text" id="edit-subcat" placeholder="Unterkategorie">
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-edit">Abbrechen</button>
        <button class="btn-confirm" id="btn-save-edit">Speichern</button>
      </div>
    </div>
  </div>

  <div id="undo-banner">
    <span>Eintrag gelöscht</span>
    <button id="btn-undo">Rückgängig</button>
  </div>

  <script src="app.js" defer></script>
</body>
</html>
