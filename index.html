<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- Erlaubt Zoom, verhindert aber ungewolltes Auto-Zooming durch 16px Schriften -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  
  <title>Gedankencockpit</title>
  
  <!-- Fallback, falls manifest fehlt -->
  <link rel="apple-touch-icon" href="icon-180.png">
  
  <style>
    /* Safe Areas & Base Colors (Kontrast repariert) */
    :root { --bg: #0f172a; --card-bg: #1e293b; --text: #f8fafc; --text-muted: #94a3b8; --accent: #3b82f6; --danger: #ef4444; }
    
    /* Layout gefixt: Zieht die App sauber unter die Notch/Dynamic Island */
    body { 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
      background: var(--bg); color: var(--text); 
      padding: calc(env(safe-area-inset-top) + 12px) 16px 100px; 
      margin: 0; overflow-wrap: anywhere; 
    }
    
    /* Inputs 16px verhindert iOS Auto-Zoom */
    input, select, button { font-family: inherit; font-size: 16px; box-sizing: border-box; } 
    
    /* Header */
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 24px; }
    .header-actions { display: flex; gap: 10px; }
    .btn-icon { background: var(--card-bg); color: var(--text); border: none; padding: 10px; border-radius: 12px; min-height: 44px; min-width: 44px; font-size: 18px; cursor: pointer; }
    
    /* Neues Feature: Suche */
    .search-bar { width: 100%; padding: 12px; border-radius: 12px; border: none; background: var(--card-bg); color: var(--text); margin-bottom: 16px; }
    
    /* Tabs (Scrollbar versteckt, Touch-Area vergrößert) */
    .tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; margin-bottom: 16px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab { background: var(--card-bg); color: var(--text-muted); border: none; padding: 10px 16px; border-radius: 20px; white-space: nowrap; min-height: 44px; font-weight: 600; cursor: pointer; }
    .tab.active { background: var(--accent); color: white; }

    /* Karten Layout */
    .card { background: var(--card-bg); border-radius: 16px; padding: 16px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; color: var(--text-muted); }
    .badge { background: #334155; padding: 4px 8px; border-radius: 8px; font-weight: bold; color: var(--text); }
    .card-text { font-size: 16px; line-height: 1.5; margin-bottom: 16px; white-space: pre-wrap; }
    .card-text a { color: var(--accent); text-decoration: underline; }
    
    /* Karten-Buttons (Sauber getrennt, 44px groß) */
    .card-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; border-top: 1px solid #334155; padding-top: 12px; }
    .btn-move, .btn-delete { flex: 1; border: none; padding: 10px; border-radius: 12px; min-height: 44px; font-weight: 600; cursor: pointer; }
    .btn-move { background: #334155; color: var(--text); }
    .btn-delete { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.2); }

    /* Modals (Hintergrund antippbar, über dem Home-Indicator) */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 100; align-items: flex-end; justify-content: center; }
    .modal-box { background: var(--card-bg); width: 100%; border-radius: 24px 24px 0 0; padding: 24px 24px calc(env(safe-area-inset-bottom) + 24px); transform: translateY(100%); transition: transform 0.3s ease-out; }
    .modal-overlay.open { display: flex; }
    .modal-overlay.open .modal-box { transform: translateY(0); }
    
    .modal-box h3 { margin-top: 0; margin-bottom: 16px; }
    .modal-box input, .modal-box select { width: 100%; padding: 12px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: var(--text); margin-bottom: 16px; }
    
    .modal-actions { display: flex; gap: 12px; }
    .modal-actions button { flex: 1; border: none; padding: 14px; border-radius: 12px; min-height: 44px; font-weight: 600; cursor: pointer; }
    .btn-cancel { background: #334155; color: var(--text); }
    .btn-confirm { background: var(--accent); color: white; }

    /* Banners */
    .banner { display: none; padding: 12px; border-radius: 12px; text-align: center; margin-bottom: 16px; font-weight: bold; }
    .banner.offline { background: #b45309; color: white; }
    .banner.error { background: var(--danger); color: white; }
    
    .loading-text { text-align: center; color: var(--text-muted); margin-top: 40px; }
    body.modal-open { overflow: hidden; } /* Sperrt scrollen im Hintergrund */
  </style>
</head>
<body>
  <div id="offline-banner" class="banner offline">Offline-Modus (Änderungen nicht möglich)</div>
  <div id="error-banner" class="banner error"></div>

  <div class="header">
    <h1>Cockpit</h1>
    <div class="header-actions">
      <button class="btn-icon" id="btn-settings" title="Einstellungen">⚙️</button>
      <button class="btn-icon" id="btn-refresh" title="Laden">↻</button>
    </div>
  </div>

  <input type="text" id="search-input" class="search-bar" placeholder="Suchen...">

  <div class="tabs" id="tabs-container"></div>

  <div id="cards-container">
    <div class="loading-text">Lade Gedanken...</div>
  </div>

  <!-- Setup Modal (Sicherheit) -->
  <div class="modal-overlay" id="setup-modal">
    <div class="modal-box">
      <h3>System einrichten</h3>
      <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 16px;">
        Sicherheit zuerst! Gib deine neue API-URL und den APP_TOKEN ein. Diese bleiben nur lokal auf deinem Gerät.
      </p>
      <input type="url" id="input-api-url" placeholder="Neue Web-App URL einfügen">
      <input type="password" id="input-api-token" placeholder="Geheimer APP_TOKEN">
      <div class="modal-actions">
        <button class="btn-confirm" id="btn-save-setup">Speichern & Verbinden</button>
      </div>
    </div>
  </div>

  <!-- Move Modal -->
  <div class="modal-overlay" id="move-modal">
    <div class="modal-box">
      <h3>Verschieben</h3>
      <select id="move-target-cat">
        <option value="Eingang">Eingang</option>
        <option value="Arbeit">Arbeit</option>
        <option value="Privat">Privat</option>
        <option value="KI">KI</option>
        <option value="Lesen">Lesen</option>
      </select>
      <input type="text" id="move-target-subcat" placeholder="Neue Unterkategorie">
      <div class="modal-actions">
        <button class="btn-cancel" id="btn-cancel-move">Abbrechen</button>
        <button class="btn-confirm" id="btn-confirm-move">Speichern</button>
      </div>
    </div>
  </div>

  <!-- defer stellt sicher, dass das DOM geladen ist -->
  <script src="app.js" defer></script>
</body>
</html>
